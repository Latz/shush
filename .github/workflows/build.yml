name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22, not 20: the popup uses ES2025 iterator helpers (.values().toArray()),
          # which Node only gained in 22. Chrome has had them since 122, the version
          # manifest.json declares as the minimum, so this is a test-runtime floor only.
          node-version: '22'
      - run: npm ci
      # Before the tests: lint is seconds, so a style break fails fast rather than after
      # the full suite. Every rule in eslint.config.js is error-level, so anything eslint
      # reports fails this step.
      - run: npm run lint
      # Popup CSS and HTML (popup.html, PRIVACY_POLICY.html), also cheap enough to run before tests.
      - run: npm run lint:css
      - run: npm run lint:html
      # tsc --checkJs against @types/chrome; catches wrong chrome.* calls before the tests do.
      - run: npm run typecheck
      # Manifest/locale validation. bin/lint-ext.mjs ignores the Firefox-only findings.
      - run: npm run lint:ext
      # High/critical only: the remaining moderate advisories are in dev tooling (vitest).
      - run: npm run audit
      - run: npm run test:coverage
      # axe-core in a real browser: colour contrast (light and dark) and ARIA need layout, which
      # jsdom does not have. Chromium is cached per playwright-core version, so the ~150 MB download
      # only happens when the lockfile moves; `install` below is then a no-op for the browser
      # itself, and --with-deps still adds its system libs.
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:a11y
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    # Official image, so nothing is pip-installed on the runner. Locally, bin/check.js runs
    # the same scan with a pip-installed semgrep.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --error: exit non-zero on any finding, so it can fail the job. Complements Sonar with
      # pattern rules for innerHTML, eval and similar sinks. Tests are not shipped code.
      - run: semgrep scan --config p/javascript --error --metrics=off background.js popup.js shared
