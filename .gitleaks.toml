# Extend the default ruleset instead of replacing it.
[extend]
useDefault = true

[allowlist]
description = "Shell variable, not a literal credential"
# bin/check(.js) calls `curl -u "${SONAR_TOKEN}:"`; the default curl-auth-user rule cannot
# tell a variable reference from a hard-coded token. It flags the old bin/check in history too.
regexes = ['''\$\{?SONAR_TOKEN\}?:''']
